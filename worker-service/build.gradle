plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'war'
}

description = 'Worker collection service deployed to Apache Tomcat'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core:13.6.0'
    implementation 'org.flywaydb:flyway-database-postgresql:13.6.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'org.postgresql:postgresql'

    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
}

tasks.named('processResources') {
    from(rootProject.file('openapi/worker-service.yaml')) {
        into 'static/openapi'
    }
}

tasks.named('bootWar') {
    archiveFileName = 'worker-service.war'
}

tasks.named('war') {
    enabled = false
}
