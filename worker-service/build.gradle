plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'war'
}

description = 'Worker collection service deployed to Apache Tomcat'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation project(':worker-contract')
    implementation 'org.wildfly:wildfly-client-all:33.0.2.Final'
    compileOnly 'jakarta.ejb:jakarta.ejb-api:4.0.1'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'


    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
}

tasks.named('processResources') {
    from(rootProject.file('openapi/worker-service.yaml')) {
        into 'static/openapi'
    }
}

tasks.named('bootWar') {
    archiveFileName = 'worker-service.war'
}

tasks.named('war') {
    enabled = false
}
