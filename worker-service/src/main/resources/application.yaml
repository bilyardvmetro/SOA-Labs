spring:
  application:
    name: worker-service
  datasource:
    url: ${WORKER_DB_URL:jdbc:postgresql://localhost:5432/studs}
    username: ${WORKER_DB_USERNAME:s413041}
    password: ${WORKER_DB_PASSWORD:your_pgpass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    baseline-on-migrate: true

worker:
  cors:
    allowed-origins: ${WORKER_CORS_ALLOWED_ORIGINS:http://localhost:5173}
