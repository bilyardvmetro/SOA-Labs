global
    maxconn 64
    nbthread 1

defaults
    mode tcp
    timeout connect 3s
    timeout client 30s
    timeout server 30s
    timeout check 5s
    timeout queue 5s

# TLS passthrough: HAProxy needs no OpenSSL support/certificate/private key.
frontend hr_public
    bind 127.0.0.1:19443
    default_backend hr_nodes

backend hr_nodes
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    default-server inter 5s fall 3 rise 2 maxconn 16
    server hr1 127.0.0.1:19444 check port 19080
    server hr2 127.0.0.1:19445 check port 19081
