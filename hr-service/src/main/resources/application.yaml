spring:
  application:
    name: hr-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true

worker-service:
  base-url: ${WORKER_SERVICE_BASE_URL:https://127.0.0.1:18443}
  connect-timeout: ${WORKER_SERVICE_CONNECT_TIMEOUT:3s}
  read-timeout: ${WORKER_SERVICE_READ_TIMEOUT:5s}

hr:
  cors:
    allowed-origins: ${HR_CORS_ALLOWED_ORIGINS:http://localhost:5173}
