plugins {
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'org.example'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    dependencyManagement {
        imports { mavenBom 'org.springframework.boot:spring-boot-dependencies:3.5.16' }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += '-parameters'
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

}

tasks.register('dist', Sync) {
    dependsOn ':worker-service:bootWar', ':worker-ear:ear', ':hr-ear:ear'
    into layout.buildDirectory.dir('dist')
    from(project(':worker-service').tasks.named('bootWar'))
    from(project(':worker-ear').tasks.named('ear'))
    from(project(':hr-ear').tasks.named('ear'))
    from('deploy/freebsd') { into 'freebsd' }
}
